<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Repos">
<title>My Repos</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1e; --sub:#5c5c63; --line:#e3e1dc;
  --accent:#2f6fde; --accent-ink:#fff; --chip:#efeee9; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111214; --card:#1b1c1f; --ink:#ececee; --sub:#a2a2aa; --line:#2c2d31;
    --accent:#5b8ff0; --accent-ink:#0d0d0f; --chip:#25262a; --shadow:0 1px 2px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
header img{width:44px;height:44px;border-radius:50%;background:var(--chip)}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
.who{color:var(--sub);font-size:14px}
.who a{color:var(--sub)}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{font:inherit;font-size:15px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);width:200px}
select,.tbtn{font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer}
.tbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{color:var(--sub);font-size:13px;margin:-6px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column}
.prev{position:relative;aspect-ratio:16/10;background:var(--chip);overflow:hidden;border-bottom:1px solid var(--line);display:block}
.prev iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none;background:#fff;opacity:0;transition:opacity .4s}
.prev iframe.ready{opacity:1}
.prev .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:700;color:var(--sub);letter-spacing:-.02em}
.noprev .prev{display:none}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-size:18px;font-weight:650;margin:0;word-break:break-word}
.desc{color:var(--sub);font-size:14px;margin:0;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--sub)}
.chip.fresh{color:#1f8a4c}
.btns{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;text-align:center;text-decoration:none;font-size:14px;font-weight:600;padding:9px 6px;border-radius:10px;
  border:1px solid var(--line);color:var(--ink);background:transparent}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(.95)}
.btn.off{opacity:.4;pointer-events:none}
.copy{border:0;background:none;color:var(--sub);font:inherit;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;align-self:flex-start}
.empty{color:var(--sub);text-align:center;padding:40px 0}
@media (max-width:600px){ .tools{margin-left:0;width:100%} input[type=search]{flex:1;width:auto} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="av" alt="">
    <div>
      <h1>My Repos</h1>
      <div class="who"><a id="prof" href="https://github.com/eadgpt" target="_blank" rel="noopener">github.com/eadgpt</a></div>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Search…" aria-label="Search repos">
      <select id="sort" aria-label="Sort">
        <option value="updated">Recently updated</option>
        <option value="name">A → Z</option>
        <option value="created">Newest first</option>
      </select>
      <button class="tbtn" id="pv" aria-pressed="true" title="Show live previews">Previews</button>
      <button class="tbtn" id="rf" title="Reload from GitHub">↻</button>
    </div>
  </header>
  <div class="status" id="st">Loading…</div>
  <div class="grid" id="grid"></div>
</div>

<script>
const USER = 'eadgpt';
// Plain-English labels for repos that have no GitHub description.
const LABELS = {
  'parallel-bible': 'English + Chinese Bible side by side, with pinyin and audio',
  'changi-routes':  'Map of flights from Changi to 9 countries',
  'mandarintalk':   '1000 Mandarin phrases for aviation, business and travel',
  'koreantalk':     'Everyday Korean: Hangul trainer, conversations, phrases',
  'zen':            'Interactive 3D zen garden: koi pond, sand garden, lake',
  'seoul2026':      'Seoul autumn trip plan booklet',
  'my-repos':       'This page: all my repos at a glance'
};
const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let repos = [];
let previews = store.get('rh_prev'); if (previews === null) previews = true;
const sortPick = store.get('rh_sort'); if (sortPick) $('#sort').value = sortPick;

function ago(iso){
  const d = (Date.now() - new Date(iso)) / 864e5;
  if (d < 1) return 'today';
  if (d < 2) return 'yesterday';
  if (d < 31) return Math.floor(d) + ' days ago';
  if (d < 365) return Math.floor(d/30.4) + ' months ago';
  return Math.floor(d/365) + ' years ago';
}
function siteUrl(r){
  if (r.homepage) return r.homepage;
  if (!r.has_pages) return null;
  if (r.name.toLowerCase() === (USER + '.github.io')) return 'https://' + USER + '.github.io/';
  return 'https://' + USER + '.github.io/' + r.name + '/';
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const q = $('#q').value.trim().toLowerCase();
  const sort = $('#sort').value;
  let list = repos.filter(r => !q || (r.name + ' ' + (r.description||'') + ' ' + (LABELS[r.name.toLowerCase()]||'')).toLowerCase().includes(q));
  list.sort((a,b) => sort === 'name' ? a.name.localeCompare(b.name, undefined, {sensitivity:'base'})
    : sort === 'created' ? new Date(b.created_at) - new Date(a.created_at)
    : new Date(b.pushed_at) - new Date(a.pushed_at));
  document.body.classList.toggle('noprev', !previews);
  $('#pv').setAttribute('aria-pressed', previews);
  const g = $('#grid');
  if (!list.length){ g.innerHTML = '<div class="empty">No repos match.</div>'; return; }
  g.innerHTML = list.map(r => {
    const site = siteUrl(r);
    const desc = r.description || LABELS[r.name.toLowerCase()] || 'No description yet';
    const fresh = (Date.now() - new Date(r.pushed_at)) < 3*864e5;
    return `<article class="card">
      <a class="prev" ${site ? `href="${esc(site)}" target="_blank" rel="noopener"` : ''} data-site="${esc(site||'')}">
        <div class="ph">${esc(r.name.slice(0,2).toUpperCase())}</div>
      </a>
      <div class="body">
        <h2 class="name">${esc(r.name)}</h2>
        <p class="desc">${esc(desc)}</p>
        <div class="meta">
          <span class="chip ${fresh?'fresh':''}">Updated ${ago(r.pushed_at)}</span>
          ${r.language ? `<span class="chip">${esc(r.language)}</span>` : ''}
          ${r.private ? '<span class="chip">Private</span>' : ''}
          ${r.fork ? '<span class="chip">Copy of another repo</span>' : ''}
        </div>
        <div class="btns">
          <a class="btn main ${site?'':'off'}" href="${esc(site||'#')}" target="_blank" rel="noopener">Open site</a>
          <a class="btn" href="${esc(r.html_url)}" target="_blank" rel="noopener">Code</a>
          <a class="btn" href="${esc(r.html_url)}/upload/${esc(r.default_branch||'main')}" target="_blank" rel="noopener">Upload</a>
        </div>
        ${site ? `<button class="copy" data-copy="${esc(site)}">Copy site link</button>` : ''}
      </div>
    </article>`;
  }).join('');
  if (previews) loadPreviews();
}

// Live mini previews, only loaded when the card scrolls into view.
let io;
function loadPreviews(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const box = e.target; io.unobserve(box);
    if (!box.dataset.site || box.querySelector('iframe')) return;
    const f = document.createElement('iframe');
    f.src = box.dataset.site; f.loading = 'lazy'; f.tabIndex = -1;
    f.setAttribute('aria-hidden','true');
    f.onload = () => f.classList.add('ready');
    box.appendChild(f); fit(box);
  }), {rootMargin:'200px'});
  document.querySelectorAll('.prev').forEach(b => io.observe(b));
}
function fit(box){ const f = box.querySelector('iframe'); if (f) f.style.transform = `scale(${box.clientWidth/1280})`; }
addEventListener('resize', () => document.querySelectorAll('.prev').forEach(fit));

async function load(){
  $('#st').textContent = 'Loading from GitHub…';
  try{
    const [u, rs] = await Promise.all([
      fetch(`https://api.github.com/users/${USER}`).then(r => { if(!r.ok) throw r.status; return r.json(); }),
      fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=updated`).then(r => { if(!r.ok) throw r.status; return r.json(); })
    ]);
    repos = rs; store.set('rh_cache', {u, rs, t: Date.now()});
    $('#av').src = u.avatar_url;
    $('#st').textContent = `${rs.length} repos · live from GitHub`;
  }catch(e){
    const c = store.get('rh_cache');
    if (c){ repos = c.rs; $('#av').src = c.u.avatar_url;
      $('#st').textContent = `${c.rs.length} repos · GitHub didn't answer, showing list from ${ago(new Date(c.t).toISOString())}`; }
    else { $('#st').textContent = "Couldn't reach GitHub. Check internet and tap ↻."; }
  }
  render();
}

$('#q').addEventListener('input', render);
$('#sort').addEventListener('change', () => { store.set('rh_sort', $('#sort').value); render(); });
$('#pv').addEventListener('click', () => { previews = !previews; store.set('rh_prev', previews); render(); });
$('#rf').addEventListener('click', load);
$('#grid').addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = 'Copied ✓'; setTimeout(() => b.textContent = 'Copy site link', 1500); });
});
load();
</script>
</body>
</html>
